<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local HTML Viewer & Runner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            font-size: 14px;
        }
        /* This iframe will handle the full screen execution */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        /* Hidden container used to launch the iframe into full screen */
        #output-container {
            display: none;
            width: 100%;
            height: 100%;
        }
        #output-container:-webkit-full-screen { display: block; width: 100vw; height: 100vh; }
        #output-container:-ms-fullscreen { display: block; width: 100vw; height: 100vh; }
        #output-container:fullscreen { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div class="container">
    <h2>HTML Viewer & Full-Screen Runner</h2>
    <p>Paste your HTML code below or upload an HTML file, then click "Run Full Screen".</p>
    
    <textarea id="code-input" placeholder="Paste your HTML, CSS, or JS code here..."></textarea>
    
    <div class="controls">
        <input type="file" id="file-input" accept=".html,.htm,.txt">
        <button onclick="runCode()">Run Full Screen</button>
    </div>
</div>

<!-- The container that gets pushed to full screen -->
<div id="output-container">
    <iframe id="output-frame"></div>
</div>

<script>
    const codeInput = document.getElementById('code-input');
    const fileInput = document.getElementById('file-input');
    const outputContainer = document.getElementById('output-container');
    const outputFrame = document.getElementById('output-frame');

    // Handle file upload and read it into the textarea
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            codeInput.value = evt.target.result;
        };
        reader.readAsText(file);
    });

    // Inject the code into the iframe and trigger full screen
    function runCode() {
        const code = codeInput.value;
        if (!code.trim()) {
            alert('Please paste some HTML code or upload a file first!');
            return;
        }

        // Write user code into the iframe
        const dst = outputFrame.contentDocument || outputFrame.contentWindow.document;
        dst.open();
        dst.write(code);
        dst.close();

        // Request full screen on the container holding the iframe
        if (outputContainer.requestFullscreen) {
            outputContainer.requestFullscreen();
        } else if (outputContainer.webkitRequestFullscreen) { /* Safari */
            outputContainer.webkitRequestFullscreen();
        } else if (outputContainer.msRequestFullscreen) { /* IE11 */
            outputContainer.msRequestFullscreen();
        }
    }

    // Listen for exiting full screen to hide the wrapper layout cleanly
    document.addEventListener('fullscreenchange', handleExit);
    document.addEventListener('webkitfullscreenchange', handleExit);
    document.addEventListener('msfullscreenchange', handleExit);

    function handleExit() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
            outputContainer.style.display = 'none';
        } else {
            outputContainer.style.display = 'block';
        }
    }
</script>

</body>
</html>
