<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local HTML Viewer & Runner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            font-size: 14px;
        }
        /* Full screen element container */
        #output-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            background: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>HTML Viewer & Full-Screen Runner</h2>
    <p>Paste your HTML code below or upload an HTML file, then click "Run Full Screen".</p>
    
    <textarea id="code-input" placeholder="Paste your HTML, CSS, or JS code here..."></textarea>
    
    <div class="controls">
        <input type="file" id="file-input" accept=".html,.htm,.txt">
        <button onclick="runCode()">Run Full Screen</button>
    </div>
</div>

<!-- The container that gets pushed to full screen -->
<div id="output-container">
    <iframe id="output-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-forms"></iframe>
</div>

<script>
    const codeInput = document.getElementById('code-input');
    const fileInput = document.getElementById('file-input');
    const outputContainer = document.getElementById('output-container');
    const outputFrame = document.getElementById('output-frame');
    let currentBlobUrl = null;

    // Handle file upload and read it into the textarea
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            codeInput.value = evt.target.result;
        };
        reader.readAsText(file);
    });

    // Inject code via Blob URL and request fullscreen
    function runCode() {
        const code = codeInput.value;
        if (!code.trim()) {
            alert('Please paste some HTML code or upload a file first!');
            return;
        }

        // Clean up previous blob URL to prevent memory leaks
        if (currentBlobUrl) {
            URL.revokeObjectURL(currentBlobUrl);
        }

        // Create a data blob containing the user's HTML code
        const blob = new Blob([code], { type: 'text/html' });
        currentBlobUrl = URL.createObjectURL(blob);
        
        // Point the iframe to the raw code file layout
        outputFrame.src = currentBlobUrl;

        // Reveal the hidden container element
        outputContainer.style.display = 'block';

        // Launch full-screen mode cleanly
        setTimeout(() => {
            if (outputContainer.requestFullscreen) {
                outputContainer.requestFullscreen().catch(err => console.log(err));
            } else if (outputContainer.webkitRequestFullscreen) { /* Safari */
                outputContainer.webkitRequestFullscreen();
            } else if (outputContainer.msRequestFullscreen) { /* IE11 */
                outputContainer.msRequestFullscreen();
            }
        }, 50);
    }

    // Listen for exiting full screen to hide the wrapper layout cleanly
    const handleExit = () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
            outputContainer.style.display = 'none';
            outputFrame.src = 'about:blank'; // Reset frame content on exit
        }
    };

    document.addEventListener('fullscreenchange', handleExit);
    document.addEventListener('webkitfullscreenchange', handleExit);
    document.addEventListener('msfullscreenchange', handleExit);
</script>

</body>
</html>
